<!DOCTYPE html>
<html class="light" lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EcoTrack - Plataforma</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script src="shared/tailwind-config.js"></script>
  <link href="shared/common.css" rel="stylesheet"/>
  <script src="shared/html-escape.js"></script>
  <script src="shared/platform-panel-render.js"></script>
  <script src="shared/platform-http.js"></script>
  <script src="shared/cliente-alta.js"></script>
  <script src="shared/role-routing.js"></script>
  <script src="shared/sidebar-role.js"></script>
</head>
<body class="bg-background font-body-md text-on-background flex h-screen overflow-hidden" data-page="plataforma">
  <div id="sidebar-placeholder"></div>
  <main class="flex-1 overflow-y-auto p-gutter lg:p-margin">
    <div class="max-w-container-max mx-auto">
      <header class="flex justify-between items-center mb-6">
        <h1 class="text-headline-md font-bold text-primary">Panel de plataforma</h1>
        <div class="flex items-center gap-3">
          <button id="btn-dark" onclick="toggleDark()" class="p-2 text-on-surface-variant hover:bg-surface-container-high rounded-full transition-colors" title="Activar tema oscuro" aria-label="Activar tema oscuro" aria-pressed="false" type="button">
            <span class="material-symbols-outlined">dark_mode</span>
          </button>
          <button id="nuevo-dispositivo" class="bg-primary text-on-primary rounded px-4 py-2">Nuevo dispositivo</button>
          <button id="nuevo-cliente" class="bg-primary text-on-primary rounded px-4 py-2">Nuevo cliente</button>
          <span id="panel-error" class="text-error text-body-sm"></span>
        </div>
      </header>
      <section id="summary" class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6"></section>
      <div class="flex flex-wrap gap-3 mb-4">
        <select id="estado" class="border rounded px-3 py-2"><option value="">Todos los estados</option><option value="fabricado">Fabricado</option><option value="reclamado_sin_enrolar">Reclamado sin enrolar</option><option value="enrolado">Enrolado</option></select>
        <input id="firmware" class="border rounded px-3 py-2" placeholder="Firmware"/>
        <button id="filtrar" class="bg-primary text-on-primary rounded px-4 py-2">Filtrar</button>
      </div>
      <div class="overflow-x-auto bg-surface rounded-lg">
        <table class="w-full text-body-sm"><thead><tr class="text-left border-b"><th class="p-3">Código</th><th class="p-3">Cliente</th><th class="p-3">Estado</th><th class="p-3">Firmware</th><th class="p-3">Conexión</th><th class="p-3">Última lectura</th><th class="p-3">Última conexión</th></tr></thead><tbody id="devices"></tbody></table>
      </div>
    </div>
  </main>
  <div id="provision-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="provision-title">
    <div class="bg-surface rounded-lg p-6 max-w-2xl w-full max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h2 id="provision-title" class="text-headline-sm font-bold">Nuevo dispositivo</h2>
        <button id="cerrar-provision" class="text-on-surface-variant" type="button" aria-label="Cerrar">Cerrar</button>
      </div>
      <form id="provision-form" class="space-y-4">
        <label class="block">Motivo obligatorio
          <textarea id="provision-motivo" class="border rounded w-full p-2" minlength="3" maxlength="200" required></textarea>
        </label>
        <label class="block">Cantidad (1 a 10)
          <input id="provision-cantidad" class="border rounded w-full p-2" type="number" min="1" max="10" value="1" required/>
        </label>
        <p id="provision-error" class="text-error text-body-sm"></p>
        <button class="bg-primary text-on-primary rounded px-4 py-2" type="submit">Fabricar</button>
      </form>
      <div id="provision-results" class="mt-4 space-y-4"></div>
    </div>
  </div>
  <div id="cliente-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="cliente-title">
    <div class="bg-surface rounded-lg p-6 max-w-2xl w-full max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h2 id="cliente-title" class="text-headline-sm font-bold">Nuevo cliente</h2>
        <button id="cerrar-cliente" class="text-on-surface-variant" type="button" aria-label="Cerrar">Cerrar</button>
      </div>
      <form id="cliente-form" class="space-y-4">
        <label class="block">Nombre del cliente
          <input id="cliente-nombre" class="border rounded w-full p-2" minlength="1" maxlength="100" required/>
        </label>
        <label class="block">Username del administrador
          <input id="cliente-username" class="border rounded w-full p-2" minlength="3" maxlength="50" required/>
        </label>
        <label class="block">Nombre del administrador
          <input id="cliente-admin" class="border rounded w-full p-2" minlength="1" maxlength="100" required/>
        </label>
        <label class="block">Motivo
          <textarea id="cliente-motivo" class="border rounded w-full p-2" minlength="3" maxlength="200" required></textarea>
        </label>
        <p id="cliente-error" class="text-error text-body-sm"></p>
        <button id="cliente-submit" class="bg-primary text-on-primary rounded px-4 py-2" type="submit">Crear cliente</button>
      </form>
      <div id="cliente-resultado" class="hidden mt-4 space-y-3">
        <p>Usuario: <strong id="cliente-resultado-username"></strong></p>
        <p>Contraseña temporal: <strong id="cliente-resultado-password"></strong></p>
        <p class="text-body-sm">Esta contraseña no se vuelve a mostrar. Entregásela al cliente por un canal seguro</p>
        <button id="cliente-copiar-password" class="border rounded px-3 py-1" type="button">Copiar</button>
        <p id="cliente-copiar-estado" class="text-body-sm"></p>
      </div>
    </div>
  </div>
  <script src="shared/app.js"></script>
  <script>
    async function loadPanel() {
      const query = new URLSearchParams();
      if (estado.value) query.set('estado', estado.value);
      if (firmware.value.trim()) query.set('firmware', firmware.value.trim());
      const response = await fetch(`${API}/api/plataforma/dispositivos?${query}`, { headers: { Authorization: token } });
      const accion = ecotrackPlatformHttp.accionPorEstadoHttp(response);
      if (accion.accion === 'cerrar-sesion') return manejarNoAutorizado();
      if (accion.accion === 'error' && !response.ok) throw new Error(accion.mensaje);
      if (!response.ok) throw new Error('No se pudo cargar el inventario');
      const body = await response.json();
      devices.innerHTML = body.items.map(ecotrackPlatformPanelRender.renderDeviceRow).join('');
    }
    async function loadSummary() {
      const response = await fetch(`${API}/api/plataforma/resumen`, { headers: { Authorization: token } });
      const accion = ecotrackPlatformHttp.accionPorEstadoHttp(response);
      if (accion.accion === 'cerrar-sesion') return manejarNoAutorizado();
      if (accion.accion === 'error' && !response.ok) throw new Error(accion.mensaje);
      if (!response.ok) throw new Error('No se pudo cargar el resumen');
      const data = await response.json();
      summary.innerHTML = Object.entries(data.dispositivos_por_estado).map(([state, total]) => ecotrackPlatformPanelRender.renderSummaryItem(state, total)).join('');
    }
    const estado = document.getElementById('estado');
    const firmware = document.getElementById('firmware');
    const devices = document.getElementById('devices');
    const panelError = document.getElementById('panel-error');
    const provisionModal = document.getElementById('provision-modal');
    const provisionForm = document.getElementById('provision-form');
    const provisionMotivo = document.getElementById('provision-motivo');
    const provisionCantidad = document.getElementById('provision-cantidad');
    const provisionError = document.getElementById('provision-error');
    const provisionResults = document.getElementById('provision-results');
    const clienteModal = document.getElementById('cliente-modal');
    const clienteForm = document.getElementById('cliente-form');
    const clienteNombre = document.getElementById('cliente-nombre');
    const clienteUsername = document.getElementById('cliente-username');
    const clienteAdmin = document.getElementById('cliente-admin');
    const clienteMotivo = document.getElementById('cliente-motivo');
    const clienteError = document.getElementById('cliente-error');
    const clienteSubmit = document.getElementById('cliente-submit');
    const clienteResultado = document.getElementById('cliente-resultado');
    const clienteResultadoUsername = document.getElementById('cliente-resultado-username');
    const clienteResultadoPassword = document.getElementById('cliente-resultado-password');
    const clienteCopiarEstado = document.getElementById('cliente-copiar-estado');
    const clienteCopiarPassword = document.getElementById('cliente-copiar-password');
    let provisionItems = null;

    function cerrarProvision() {
      provisionItems = null;
      provisionResults.replaceChildren();
      provisionError.textContent = '';
      provisionForm.reset();
      provisionCantidad.value = '1';
      provisionModal.classList.add('hidden');
    }

    function cerrarCliente() {
      if (!clienteResultado.classList.contains('hidden') && !confirm('¿Cerrar sin volver a mostrar la contraseña temporal?')) {
        return;
      }
      clienteResultadoPassword.textContent = '';
      clienteResultadoUsername.textContent = '';
      clienteCopiarEstado.textContent = '';
      clienteForm.reset();
      clienteError.textContent = '';
      clienteResultado.classList.add('hidden');
      clienteForm.classList.remove('hidden');
      clienteModal.classList.add('hidden');
    }

    function descargarNvs(item) {
      const blob = new Blob([item.nvs_csv], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `${item.codigo}.nvs.csv`;
      link.click();
      URL.revokeObjectURL(url);
    }

    function renderProvisionResults(items) {
      provisionResults.replaceChildren();
      const warning = document.createElement('p');
      warning.className = 'text-error text-body-sm';
      warning.textContent = 'El CSV contiene el secreto del dispositivo. Descargalo y borrá el archivo después de flashear.';
      provisionResults.append(warning);
      items.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'border rounded p-3';
        const code = document.createElement('strong');
        code.textContent = item.codigo;
        const token = document.createElement('p');
        token.textContent = `Token de reclamo: ${item.token_reclamo}`;
        const copy = document.createElement('button');
        copy.type = 'button';
        copy.className = 'border rounded px-3 py-1 mr-2';
        copy.textContent = 'Copiar token';
        copy.addEventListener('click', async () => {
          await navigator.clipboard.writeText(item.token_reclamo);
        });
        const download = document.createElement('button');
        download.type = 'button';
        download.className = 'bg-primary text-on-primary rounded px-3 py-1';
        download.textContent = 'Descargar CSV';
        download.addEventListener('click', () => descargarNvs(item));
        card.append(code, token, copy, download);
        provisionResults.append(card);
      });
    }

    async function fabricarDispositivos(event) {
      event.preventDefault();
      provisionError.textContent = '';
      const response = await fetch(`${API}/api/plataforma/dispositivos`, {
        method: 'POST',
        headers: { Authorization: token, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          motivo: provisionMotivo.value,
          cantidad: Number(provisionCantidad.value),
        }),
      });
      const accion = ecotrackPlatformHttp.accionPorEstadoHttp(response);
      if (accion.accion === 'cerrar-sesion') return manejarNoAutorizado();
      const body = await response.json().catch(() => ({}));
      if (!response.ok) {
        provisionError.textContent = body.error || 'No se pudieron fabricar los dispositivos';
        return;
      }
      provisionItems = body.items;
      renderProvisionResults(provisionItems);
      try {
        await Promise.all([loadPanel(), loadSummary()]);
      } catch (error) {
        panelError.textContent = error.message;
      }
    }

    async function crearCliente(event) {
      event.preventDefault();
      clienteError.textContent = '';
      const resultado = ecotrackClienteAlta.validarAltaCliente({
        nombreCliente: clienteNombre.value,
        username: clienteUsername.value,
        nombreAdmin: clienteAdmin.value,
        motivo: clienteMotivo.value,
      });
      if (!resultado.ok) {
        clienteError.textContent = resultado.error;
        return;
      }

      clienteSubmit.disabled = true;
      try {
        const response = await fetch(`${API}/api/plataforma/clientes`, {
          method: 'POST',
          headers: { Authorization: token, 'Content-Type': 'application/json' },
          body: JSON.stringify(resultado.datos),
        });
        const accion = ecotrackPlatformHttp.accionPorEstadoHttp(response);
        if (accion.accion === 'cerrar-sesion') return manejarNoAutorizado();
        const body = await response.json().catch(() => ({}));
        if (!response.ok) {
          clienteError.textContent = body.error || 'No se pudo crear el cliente';
          return;
        }

        clienteResultadoUsername.textContent = body.usuario?.username ?? '';
        clienteResultadoPassword.textContent = body.password_temporal;
        clienteForm.classList.add('hidden');
        clienteResultado.classList.remove('hidden');
        try {
          await loadSummary();
        } catch (error) {
          panelError.textContent = error.message;
        }
      } catch (error) {
        clienteError.textContent = 'No se pudo conectar al servidor';
      } finally {
        clienteSubmit.disabled = false;
      }
    }

    document.getElementById('nuevo-dispositivo').addEventListener('click', () => {
      provisionModal.classList.remove('hidden');
      provisionMotivo.focus();
    });
    document.getElementById('cerrar-provision').addEventListener('click', cerrarProvision);
    provisionForm.addEventListener('submit', fabricarDispositivos);
    document.getElementById('nuevo-cliente').addEventListener('click', () => {
      clienteModal.classList.remove('hidden');
      clienteNombre.focus();
    });
    document.getElementById('cerrar-cliente').addEventListener('click', cerrarCliente);
    clienteForm.addEventListener('submit', crearCliente);
    clienteCopiarPassword.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(clienteResultadoPassword.textContent);
        clienteCopiarEstado.textContent = 'Copiada';
      } catch (error) {
        clienteCopiarEstado.textContent = 'No se pudo copiar, seleccionala a mano';
      }
    });
    document.getElementById('filtrar').addEventListener('click', loadPanel);
    initShell().then(() => {
      // Este guard mejora la UX; la autorización real la aplica el backend.
      const acceso = ecotrackRoleRouting.decidirAcceso({ rol, pagina: 'plataforma', haySesion: Boolean(token) });
      if (acceso.permitido) {
        Promise.all([loadPanel(), loadSummary()]).catch(error => { panelError.textContent = error.message; });
      }
    });
  </script>
</body>
</html>
