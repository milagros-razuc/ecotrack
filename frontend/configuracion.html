<!DOCTYPE html>
<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EcoTrack - Configuración</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="shared/tailwind-config.js"></script>
<link href="shared/common.css" rel="stylesheet"/>
<style>
#toast{transition:all .4s;transform:translateY(100px);opacity:0;}
#toast.show{transform:translateY(0);opacity:1;}
</style>
</head>
<body class="bg-background font-body-md text-on-background flex h-screen overflow-hidden" data-page="configuracion">

<div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 z-50 bg-primary text-white px-6 py-3 rounded-full shadow-xl flex items-center gap-3 font-bold text-body-sm">
  <span class="material-symbols-outlined">check_circle</span>
  <span id="toast-text">Guardado</span>
</div>

<!-- Sidebar (inyectado por shared/app.js) -->
<div id="sidebar-placeholder"></div>

<!-- Main -->
<div class="flex-1 flex flex-col min-w-0 overflow-hidden">
  <header class="flex justify-between items-center w-full px-gutter h-16 border-b border-outline-variant bg-surface shrink-0 z-10">
    <span class="text-headline-md font-headline-md font-bold text-primary">Configuración de Alertas</span>
    <div class="flex items-center gap-3">
      <select id="select-dispositivo" onchange="cargarUmbrales()" class="text-body-sm border border-outline-variant rounded-lg px-3 py-2 bg-surface-container-low outline-none"></select>
      <button onclick="toggleDark()" id="btn-dark" class="p-2 text-on-surface-variant hover:bg-surface-container-high rounded-full transition-colors" title="Modo oscuro">
        <span class="material-symbols-outlined">dark_mode</span>
      </button>
    </div>
  </header>

  <main class="flex-1 overflow-y-auto p-gutter lg:p-margin">
    <div class="max-w-container-max mx-auto space-y-stack-xl">

      <section class="flex flex-col md:flex-row justify-between items-end gap-stack-lg border-b border-outline-variant pb-stack-lg">
        <div class="max-w-2xl">
          <h3 class="font-headline-lg text-headline-lg text-on-surface mb-stack-xs">Umbrales de Monitoreo</h3>
          <p class="text-body-md text-on-surface-variant">Definí los límites operativos para cada sensor. El sistema genera una alerta automática si un valor detectado excede el rango mínimo o máximo establecido.</p>
        </div>
        <button onclick="guardarTodo()" class="px-6 py-3 bg-primary text-on-primary font-label-bold text-label-bold uppercase tracking-wider hover:opacity-90 transition-all flex items-center gap-2 rounded">
          <span class="material-symbols-outlined text-[18px]">save</span> Guardar Cambios
        </button>
      </section>

      <div class="bg-white precision-border rounded overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full border-collapse text-left">
            <thead>
              <tr class="bg-surface-container-low border-b border-outline-variant">
                <th class="px-gutter py-stack-md font-label-bold text-label-bold text-on-surface-variant uppercase">Sensor</th>
                <th class="px-gutter py-stack-md font-label-bold text-label-bold text-on-surface-variant uppercase">Valor Actual</th>
                <th class="px-gutter py-stack-md font-label-bold text-label-bold text-on-surface-variant uppercase text-center">Mínimo</th>
                <th class="px-gutter py-stack-md font-label-bold text-label-bold text-on-surface-variant uppercase text-center">Máximo</th>
                <th class="px-gutter py-stack-md font-label-bold text-label-bold text-on-surface-variant uppercase text-right">Notificaciones</th>
              </tr>
            </thead>
            <tbody id="tabla-umbrales" class="divide-y divide-outline-variant">
              <tr><td colspan="5" class="px-gutter py-4 text-center text-on-surface-variant">Cargando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>
</div>

<script src="shared/app.js"></script>
<script>
function mostrarToast(texto, esError) {
  const toast = document.getElementById('toast');
  document.getElementById('toast-text').textContent = texto;
  toast.querySelector('.material-symbols-outlined').textContent = esError ? 'error' : 'check_circle';
  toast.classList.toggle('bg-error', !!esError);
  toast.classList.toggle('bg-primary', !esError);
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

// Definición de sensores reales (el hardware ESP32 actual no mide CO2,
// esa variable no tiene endpoint de umbral todavía).
const SENSORES = [
  { variable: 'temperatura', label: 'Temperatura Ambiental', icon: 'device_thermostat', unidad: '°C' },
  { variable: 'humedad', label: 'Humedad Relativa', icon: 'humidity_percentage', unidad: '%' },
  { variable: 'luminosidad', label: 'Intensidad Lumínica', icon: 'light_mode', unidad: '%' },
];

let dispositivoActual = '';
let umbralesActuales = {};
let ultimaLectura = null;

async function cargarDispositivos() {
  const res = await fetch(`${API}/api/dispositivos`, { headers: { Authorization: token } });
  if (res.status === 401) return manejarNoAutorizado();
  const dispositivos = await res.json();
  const sel = document.getElementById('select-dispositivo');
  sel.innerHTML = dispositivos.map(d => `<option value="${d.codigo}">${d.codigo}${d.ubicacion ? ' — ' + d.ubicacion : ''}</option>`).join('');
  if (dispositivos.length) dispositivoActual = dispositivos[0].codigo;
}

async function cargarUmbrales() {
  dispositivoActual = document.getElementById('select-dispositivo').value || dispositivoActual;
  const h = { Authorization: token };

  const [resU, resL] = await Promise.all([
    fetch(`${API}/api/umbrales?dispositivo=${dispositivoActual}`, { headers: h }),
    fetch(`${API}/api/lecturas?dispositivo=${dispositivoActual}&limite=1`, { headers: h }),
  ]);
  if (resU.status === 401 || resL.status === 401) return manejarNoAutorizado();

  const umbrales = await resU.json();
  umbralesActuales = {};
  umbrales.forEach(u => { umbralesActuales[u.variable] = u; });

  const lecturas = await resL.json();
  ultimaLectura = lecturas[0] || null;

  renderTabla();
}

function renderTabla() {
  document.getElementById('tabla-umbrales').innerHTML = SENSORES.map(s => {
    const u = umbralesActuales[s.variable];
    const valorActual = ultimaLectura ? parseFloat(ultimaLectura[s.variable === 'temperatura' ? 'temperatura' : s.variable === 'humedad' ? 'humedad' : 'luminosidad']) : null;
    const notifChecked = !u || u.notificaciones_activas !== false;
    return `
    <tr class="hover:bg-surface-container-low transition-colors" data-variable="${s.variable}">
      <td class="px-gutter py-stack-md">
        <div class="flex items-center gap-stack-sm">
          <span class="material-symbols-outlined text-on-surface-variant">${s.icon}</span>
          <span class="font-bold text-on-surface text-body-md">${s.label}</span>
        </div>
      </td>
      <td class="px-gutter py-stack-md font-data-mono text-body-md text-primary font-bold">
        ${valorActual !== null && !isNaN(valorActual) ? valorActual.toFixed(1) + s.unidad : '—'}
      </td>
      <td class="px-gutter py-stack-md">
        <div class="flex justify-center">
          <input class="input-min w-24 text-center px-2 py-2 border border-outline rounded-lg font-data-mono focus:border-primary focus:ring-1 focus:ring-primary outline-none" type="number" step="0.1" value="${u ? u.umbral_min : ''}"/>
        </div>
      </td>
      <td class="px-gutter py-stack-md">
        <div class="flex justify-center">
          <input class="input-max w-24 text-center px-2 py-2 border border-outline rounded-lg font-data-mono focus:border-primary focus:ring-1 focus:ring-primary outline-none" type="number" step="0.1" value="${u ? u.umbral_max : ''}"/>
        </div>
      </td>
      <td class="px-gutter py-stack-md text-right">
        <label class="relative inline-flex items-center cursor-pointer">
          <input class="input-notif sr-only peer" type="checkbox" ${notifChecked ? 'checked' : ''}/>
          <div class="w-11 h-6 bg-tertiary rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
        </label>
      </td>
    </tr>`;
  }).join('') + `
    <tr class="bg-surface-container-low opacity-60">
      <td class="px-gutter py-stack-md">
        <div class="flex items-center gap-stack-sm">
          <span class="material-symbols-outlined text-on-surface-variant">co2</span>
          <span class="font-bold text-on-surface text-body-md">Niveles de CO2</span>
        </div>
      </td>
      <td class="px-gutter py-stack-md text-on-surface-variant text-body-sm" colspan="4">Sensor no disponible en el hardware actual</td>
    </tr>`;
}

async function guardarTodo() {
  const filas = document.querySelectorAll('#tabla-umbrales tr[data-variable]');
  const promesas = [];
  let huboError = false;

  filas.forEach(fila => {
    const variable = fila.dataset.variable;
    const umbralMin = parseFloat(fila.querySelector('.input-min').value);
    const umbralMax = parseFloat(fila.querySelector('.input-max').value);
    const notificacionesActivas = fila.querySelector('.input-notif').checked;

    if (isNaN(umbralMin) || isNaN(umbralMax)) { huboError = true; return; }

    promesas.push(
      fetch(`${API}/api/umbrales`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: token },
        body: JSON.stringify({ dispositivoCodigo: dispositivoActual, variable, umbralMin, umbralMax, notificacionesActivas }),
      }).then(r => { if (r.status === 401) manejarNoAutorizado(); return r.json(); })
    );
  });

  if (huboError) return mostrarToast('Revisá los valores mínimo/máximo', true);

  try {
    const resultados = await Promise.all(promesas);
    const falló = resultados.some(r => r.error);
    if (falló) mostrarToast(resultados.find(r => r.error).error, true);
    else { mostrarToast('Umbrales guardados correctamente'); cargarUmbrales(); }
  } catch (e) {
    mostrarToast('Error al guardar', true);
  }
}

// Init
initShell().then(() => {
  cargarDispositivos().then(cargarUmbrales);
});
</script>
</body></html>
