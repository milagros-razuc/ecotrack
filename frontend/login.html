<!DOCTYPE html>
<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EcoTrack - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="shared/tailwind-config.js"></script>
<link href="shared/common.css" rel="stylesheet"/>
<style>
  body { font-family: 'Inter', sans-serif; }
</style>
</head>
<body class="bg-surface-container min-h-screen flex items-center justify-center relative overflow-hidden">
<div class="absolute inset-0 z-0 opacity-10 bg-cover bg-center" style="background-image: url('https://lh3.googleusercontent.com/aida/ADBb0uh-651_0fm4AUQJkdkgm7kxUBia37r9aHrB1lKSNFifMy1fSXgegNJM3y_i4sUhIjIQv8rii8wfJngMwafdG0kUiLiP9PFD6dYUYscsdFQnHXvWahtrVJ2QiBmNfok6P8pcXLE6MPr6OBXhRVjBE8YdWlopsQJjVVxBshQIe8mfAKoooB6MBqXCiRIRsuiilg-vfOxOGTVvJ2j4f8jcYl1fjSmfE5e-fH-epl2usGgxoKImDGRpLGe4P9PG')"></div>
<main class="relative z-10 w-full max-w-[440px] px-gutter py-stack-xl">
  <div class="bg-surface-container-lowest border border-outline-variant p-margin flex flex-col gap-stack-lg">
    <div class="flex flex-col items-center gap-stack-md text-center">
      <div class="w-48">
        <img alt="EcoTrack Logo" class="w-full h-full object-contain" src="ecotrack-logo.png"/>
      </div>
      <p class="font-body-sm text-body-sm text-on-surface-variant mt-stack-xs uppercase tracking-widest font-semibold">Global Monitoring Portal</p>
    </div>

    <!-- Error message -->
    <div id="error-msg" class="hidden bg-error-container border border-error text-on-error-container text-body-sm p-3 rounded flex items-center gap-2">
      <span class="material-symbols-outlined text-error text-[18px]">error</span>
      <span id="error-text">Usuario o contraseña incorrectos</span>
    </div>

    <form id="login-form" class="flex flex-col gap-stack-md">
      <div class="flex flex-col gap-stack-sm">
        <label class="font-label-bold text-label-bold text-on-surface-variant uppercase" for="username">Usuario</label>
        <div class="relative group">
          <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">person</span>
          <input class="w-full pl-10 pr-4 py-3 bg-surface border border-outline-variant text-on-surface font-body-md focus:border-on-surface-variant focus:ring-0 transition-all outline-none" id="username" placeholder="Ingresá tu usuario" type="text" autocomplete="username"/>
        </div>
      </div>
      <div class="flex flex-col gap-stack-sm">
        <label class="font-label-bold text-label-bold text-on-surface-variant uppercase" for="password">Contraseña</label>
        <div class="relative group">
          <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
          <input class="w-full pl-10 pr-4 py-3 bg-surface border border-outline-variant text-on-surface font-body-md focus:border-on-surface-variant focus:ring-0 transition-all outline-none" id="password" placeholder="••••••••" type="password" autocomplete="current-password"/>
        </div>
      </div>
      <button id="btn-login" class="w-full h-[48px] bg-primary text-on-primary font-label-bold text-label-bold uppercase tracking-wider flex items-center justify-center gap-stack-sm hover:brightness-110 active:scale-[0.98] transition-all" type="submit">
        <span id="btn-text">Iniciar Sesión</span>
        <span class="material-symbols-outlined text-[20px]">login</span>
      </button>
    </form>
  </div>
  <div class="mt-stack-xl flex justify-between px-2">
    <div class="flex items-center gap-stack-xs">
      <span class="w-2 h-2 rounded-full bg-primary-container animate-pulse"></span>
      <span class="font-label-bold text-label-bold text-on-surface-variant uppercase">System Active</span>
    </div>
    <span class="font-label-bold text-label-bold text-on-surface-variant opacity-50">V. 1.0.0</span>
  </div>
</main>

<script>
const API = `http://${location.hostname}:3000`;

// Si ya está logueado, ir directo al dashboard
if (localStorage.getItem('ecotrack_token')) {
  window.location.href = 'index.html';
}

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('btn-login');
  const btnText = document.getElementById('btn-text');
  const errorMsg = document.getElementById('error-msg');
  const errorText = document.getElementById('error-text');

  if (!username || !password) {
    errorText.textContent = 'Completá usuario y contraseña';
    errorMsg.classList.remove('hidden');
    return;
  }

  btn.disabled = true;
  btnText.textContent = 'Ingresando...';
  errorMsg.classList.add('hidden');

  try {
    const res = await fetch(`${API}/api/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();

    if (!res.ok) {
      errorText.textContent = data.error || 'Error al iniciar sesión';
      errorMsg.classList.remove('hidden');
      btn.disabled = false;
      btnText.textContent = 'Iniciar Sesión';
      return;
    }

    localStorage.setItem('ecotrack_token', data.token);
    localStorage.setItem('ecotrack_username', data.username || username);
    localStorage.setItem('ecotrack_nombre', data.nombre);
    window.location.href = 'index.html';

  } catch (err) {
    errorText.textContent = 'No se pudo conectar al servidor';
    errorMsg.classList.remove('hidden');
    btn.disabled = false;
    btnText.textContent = 'Iniciar Sesión';
  }
});
</script>
</body></html>
