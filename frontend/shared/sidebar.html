      <div id="avatar-sidebar" class="h-9 w-9 rounded-full bg-primary flex items-center justify-center text-white font-bold text-body-sm shrink-0">--</div>

    <div id="profile-menu" class="absolute bottom-full left-2 right-2 mb-1 bg-surface border border-outline-variant rounded-lg shadow-xl overflow-hidden">

<!-- Pop-up de alerta en tiempo real -->
<!-- top-24 (96px) para quedar debajo del header (h-16 = 64px) en vez de superponerse -->
<div id="alerta-popup" class="hidden fixed top-24 right-6 z-[70] w-[calc(100%-3rem)] max-w-sm bg-white border-l-4 border-error rounded shadow-2xl p-stack-md items-start gap-3">  <div class="bg-error p-2 rounded text-white shrink-0">
    <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1;">warning</span>
  </div>
  <div class="flex-1 min-w-0">
    <p class="font-bold text-on-surface text-body-sm">Alerta: <span id="alerta-popup-dispositivo">—</span></p>
    <p id="alerta-popup-detalle" class="text-on-surface-variant text-body-sm">—</p>
  </div>
  <button onclick="cerrarAlertaPopup()" class="text-on-surface-variant hover:opacity-70 shrink-0">
    <span class="material-symbols-outlined text-[18px]">close</span>
  </button>
</div>

<!-- Modal "Mi perfil" -->
<div id="modal-perfil" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40">
  <div class="bg-white rounded p-stack-lg w-full max-w-sm mx-4 flex flex-col gap-stack-md">
    <h3 class="font-headline-md text-on-secondary-container">Mi perfil</h3>
    <div id="perfil-contenido" class="flex flex-col gap-3 text-body-sm">
      <p class="text-on-surface-variant">Cargando...</p>
    </div>
    <div class="flex justify-end gap-2">
      <button onclick="cerrarPerfil()" class="px-4 py-2 text-on-surface-variant font-label-bold text-label-bold uppercase rounded hover:bg-surface-container-low transition-all">Cerrar</button>
      <button onclick="guardarPerfil()" class="px-4 py-2 bg-primary text-on-primary font-label-bold text-label-bold uppercase rounded hover:opacity-90 transition-all">Guardar</button>
    </div>
  </div>
</div>

<!-- Modal "Cambiar contraseña" -->
<div id="modal-password" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40">
  <div class="bg-white rounded p-stack-lg w-full max-w-sm mx-4 flex flex-col gap-stack-md">
    <h3 class="font-headline-md text-on-secondary-container">Cambiar contraseña</h3>
    <div class="flex flex-col gap-1">
      <label class="text-label-bold text-on-surface-variant uppercase">Contraseña actual</label>
      <input id="password-actual" type="password" class="px-3 py-2 border border-outline-variant rounded-lg text-body-sm outline-none focus:border-primary"/>
    </div>
    <div class="flex flex-col gap-1">
      <label class="text-label-bold text-on-surface-variant uppercase">Contraseña nueva</label>
      <input id="password-nueva" type="password" class="px-3 py-2 border border-outline-variant rounded-lg text-body-sm outline-none focus:border-primary" placeholder="Mín. 6 caracteres"/>
    </div>
    <p id="password-error" class="hidden text-error text-body-sm"></p>
    <div class="flex justify-end gap-2">
      <button onclick="cerrarCambiarPassword()" class="px-4 py-2 text-on-surface-variant font-label-bold text-label-bold uppercase rounded hover:bg-surface-container-low transition-all">Cancelar</button>
      <button onclick="enviarCambiarPassword()" class="px-4 py-2 bg-primary text-on-primary font-label-bold text-label-bold uppercase rounded hover:opacity-90 transition-all">Guardar</button>
    </div>
  </div>
</div>
