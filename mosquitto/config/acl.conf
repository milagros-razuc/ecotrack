# El backend puede leer las lecturas de cualquier dispositivo
user backend
topic read ecotrack/+/lecturas

# Cada ESP32 solo puede publicar en su propio topic.
# Al agregar un dispositivo nuevo, sumá una entrada igual a estas dos líneas,
# reemplazando ESP32-XXX por su deviceId.
user esp32-001
topic write ecotrack/ESP32-001/lecturas
